name: checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run checks
        run: |
          set -e
          bash scripts/check-links.sh
          bash scripts/check-descriptions.sh
          bash scripts/check-template-skills.sh
          bash scripts/check-codex-policy.sh
          bash scripts/check-state-paths.sh
          bash scripts/check-state-paths.test.sh
          bash scripts/check-finding-gate.sh
          bash scripts/check-finding-gate.test.sh
          bash dead-branch-guard/scripts/pre-push.test.sh
          bash auto-mode-setup/scripts/deny-rules.test.sh
          bash scripts/link-skills-claude-md.test.sh
          bash whats-next/scripts/wip.test.sh
          for t in .claude/workflows/*.test.js clean-room/*.test.mjs; do
            node --test "$t"
          done
      - name: dotnet format
        run: dotnet format whats-next --verify-no-changes
      - name: dotnet build
        run: dotnet build whats-next -warnaserror
      - name: dotnet test
        run: dotnet test whats-next
