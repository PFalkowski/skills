# Tuned for attaching from a phone (Termius) as well as a laptop.

# The single setting that makes a small screen usable: pane select and scrollback by touch.
set -g mouse on

# A phone reconnects often and you read the backlog after the fact, not live.
set -g history-limit 50000

# Two clients of different sizes attach to this session constantly. Without this, the
# laptop window shrinks to the phone every time the phone connects.
setw -g aggressive-resize on

# 0 is the far end of a phone keyboard; start at 1 and close the gaps when a window goes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Colours inside the dev container are wrong without this. The terminfo entry is present
# on Debian 13; screen-256color is the fallback if it ever is not.
set -g default-terminal "tmux-256color"

# The default 500ms swallows Esc, which makes vim and readline feel broken over a phone link.
set -sg escape-time 10

# Which session and which host - both worth seeing when Termius has several tabs open.
set -g status-left "#[bold] #S #[default] "
set -g status-right " #H  %H:%M "
set -g status-left-length 30
